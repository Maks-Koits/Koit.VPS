global:
  scrape_interval: 30s
  scrape_timeout: 20s

scrape_configs:
  - job_name: logporter
    scrape_interval: 15s
    scrape_timeout: 4s
    static_configs:
      - targets:
          - monitoring-logporter:9333

  - job_name: prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
        - monitoring-node-exporter:9100