global:
  scrape_interval: 30s
  scrape_timeout: 20s

scrape_configs:
  - job_name: docker
    scrape_interval: 15s
    static_configs:
      - targets:
          - monitoring-docker-exporter:9713

  - job_name: prometheus
    scrape_interval: 15s
    static_configs:
      - targets:
        - monitoring-node-exporter:9100