---
services:

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: 'monitoring-victoriametrics'
    volumes:
      - ./victoriametrics/scrape.yaml:/etc/victoriametrics/scrape.yaml:ro
      - victoriametrics_data:/victoria-metrics-data
    command:
      - '-storageDataPath=/victoria-metrics-data'
      - '-retentionPeriod=365d'
      - '-promscrape.config=/etc/victoriametrics/scrape.yaml'
      - '-httpListenAddr=:8428'
    ports:
      - '8428:8428'
    environment:
      - TZ=Europe/Minsk
    restart: unless-stopped
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest-slim
    container_name: 'monitoring-grafana'
    depends_on:
      - victoriametrics
    ports:
      - '3000:3000'
    volumes:
      - grafana_data:/var/lib/grafana:rw
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
    env_file:
      - ./grafana/config.monitoring
    environment:
      GF_SERVER_ROOT_URL: 'https://grafana.maks-koits.cv/'
      GF_SERVER_DOMAIN: 'grafana.maks-koits.cv'
      TZ: 'Europe/Minsk'
      VIRTUAL_HOST: 'grafana.maks-koits.cv'
      VIRTUAL_PORT: '3000'
      VIRTUAL_NETWORK: 'net'
      LETSENCRYPT_HOST: 'grafana.maks-koits.cv'
      LETSENCRYPT_EMAIL: 'mix256@gmail.com'
    restart: unless-stopped
    networks:
      - monitoring
      - net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: 'monitoring-node-exporter'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.ignored-mount-points'
      - "^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"
    ports:
      - '9100:9100'
    environment:
      - TZ=Europe/Minsk
    restart: unless-stopped
    networks:
      - monitoring

  logporter:
    image: lifailon/logporter:latest
    container_name: 'monitoring-logporter'
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - '9333:9333'
    environment:
      - TZ=Europe/Minsk
      - DOCKER_METRICS_CACHE=30
    networks:
      - net
      - monitoring

networks:
  monitoring:
  net:
    name: net
    external: true

volumes:
    grafana_data:
    victoriametrics_data: