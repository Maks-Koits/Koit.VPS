name: SSH Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH Agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_TIMEWEB }}

    - name: Add GitHub to known_hosts
      run: |
        ssh-keyscan -H github.com >> ~/.ssh/known_hosts

    - name: Deploy to Remote Server
      env:
        REMOTE_HOST: ${{ secrets.REMOTE_HOST_TIMEWEB }}
        REMOTE_USER: ${{ secrets.REMOTE_USER_TIMEWEB }}
        REMOTE_PORT: ${{ secrets.REMOTE_PORT_TIMEWEB }}
        GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        GIT_USER: ${{ secrets.GIT_USER }}
      run: |
        ssh -o StrictHostKeyChecking=no -p $REMOTE_PORT $REMOTE_USER@$REMOTE_HOST '
          cd /app/Koit.VPS/ && git pull && docker compose pull || true
          cd /app/Koit.VPS/monitoring && docker compose pull || true

          cd /app/Koit.VPS/
          docker compose up -d --build --wait

          cd /app/Koit.VPS/monitoring
          docker compose up -d --build --wait

          docker image prune -f
          
          bash /app/Koit.VPS/bash/swap.sh || true
        '